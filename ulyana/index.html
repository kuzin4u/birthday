<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ульяне — 8! 🎂</title>

<!-- OG-теги: WhatsApp, Telegram, MAX покажут красивую превью-карточку -->
<meta property="og:title" content="🎂 Ульяне — 8! Нажми, чтобы играть!">
<meta property="og:description" content="Интерактивное поздравление с играми, музыкой и сюрпризами!">
<meta property="og:image" content="https://kuzin4u.github.io/birthday/ulyana/ulyana_invite.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kuzin4u.github.io/birthday/ulyana/">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(circle at 50% 40%,#1a0533,#0d001a);
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;color:#fff;
  -webkit-tap-highlight-color:transparent;
}
.card{
  text-align:center;padding:24px;max-width:420px;width:100%;
  animation:fadeIn 0.8s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Stars */
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.stars span{
  position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{0%{opacity:.2}100%{opacity:.8}}

/* Character */
.char{margin:0 auto 16px;width:160px;height:160px}

/* Balloons */
.balloons{display:flex;justify-content:center;gap:18px;margin-bottom:12px}
.balloon{
  width:36px;height:46px;border-radius:50%;position:relative;
  animation:float 2.5s ease-in-out infinite alternate;
}
.balloon::after{
  content:'';position:absolute;bottom:-14px;left:50%;width:1.5px;height:14px;
  background:#aaa;transform:translateX(-50%);
}
.b1{background:#FF6B6B;animation-delay:0s}
.b2{background:#FFD93D;animation-delay:0.4s}
.b3{background:#4ECDC4;animation-delay:0.8s}
.b4{background:#C97BFF;animation-delay:1.2s}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-12px)}}

.title{
  font-size:clamp(42px,10vw,56px);font-weight:900;
  color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,.5);
  margin:16px 0 8px;
}
.sub{
  font-size:clamp(16px,4vw,20px);color:#4ECDC4;margin-bottom:28px;
  text-shadow:0 0 15px rgba(78,205,196,.4);
}

.play-btn{
  display:inline-block;
  padding:18px 48px;border-radius:50px;border:none;
  background:linear-gradient(135deg,#FF6B9D,#C97BFF);
  color:#fff;font-size:clamp(20px,5vw,26px);font-weight:800;
  cursor:pointer;text-decoration:none;
  box-shadow:0 4px 25px rgba(201,123,255,.5);
  animation:pulse 1.8s ease-in-out infinite;
  transition:transform .15s;
}
.play-btn:active{transform:scale(0.95)}
@keyframes pulse{
  0%,100%{box-shadow:0 4px 25px rgba(201,123,255,.4)}
  50%{box-shadow:0 4px 40px rgba(201,123,255,.7)}
}

.hint{margin-top:20px;font-size:13px;color:#888;opacity:.7}

/* Loading overlay */
.loading{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1a0533,#0d001a);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  z-index:999;
}
.loading.on{display:flex}
.spinner{
  width:50px;height:50px;border:4px solid rgba(255,215,0,.2);
  border-top-color:#FFD700;border-radius:50%;
  animation:spin .8s linear infinite;margin-bottom:16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#4ECDC4;font-size:16px}
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Main card -->
<div class="card">
  <div class="balloons">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
  </div>
  
  <!-- Ульф SVG -->
  <div class="char">
    <svg viewBox="0 0 100 100" width="160" height="160">
      <ellipse cx="50" cy="58" rx="38" ry="40" fill="#8B4513"/>
      <ellipse cx="50" cy="62" rx="32" ry="34" fill="#A0522D"/>
      <circle cx="20" cy="30" r="14" fill="#8B4513"/>
      <circle cx="20" cy="30" r="9" fill="#DEB887"/>
      <circle cx="80" cy="30" r="14" fill="#8B4513"/>
      <circle cx="80" cy="30" r="9" fill="#DEB887"/>
      <ellipse cx="50" cy="45" rx="22" ry="18" fill="#DEB887"/>
      <circle cx="41" cy="40" r="5" fill="#222"/>
      <circle cx="59" cy="40" r="5" fill="#222"/>
      <circle cx="43" cy="38" r="2" fill="#fff"/>
      <circle cx="61" cy="38" r="2" fill="#fff"/>
      <ellipse cx="50" cy="48" rx="5" ry="3.5" fill="#333"/>
      <path d="M42,53 Q50,61 58,53" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
      <!-- Party hat -->
      <polygon points="50,8 34,30 66,30" fill="#FF6B9D"/>
      <polygon points="50,8 40,24 60,24" fill="#FF9EC5"/>
      <circle cx="50" cy="6" r="4" fill="#FFD700"/>
      <rect x="34" y="28" width="32" height="5" rx="2" fill="#4ECDC4"/>
      <!-- Arms -->
      <path d="M18,55 Q-2,35 5,22" fill="none" stroke="#8B4513" stroke-width="9" stroke-linecap="round"/>
      <path d="M82,55 Q102,35 95,22" fill="none" stroke="#8B4513" stroke-width="9" stroke-linecap="round"/>
      <circle cx="5" cy="20" r="6" fill="#A0522D"/>
      <circle cx="95" cy="20" r="6" fill="#A0522D"/>
    </svg>
  </div>

  <div class="title">УЛЬЯНЕ — 8!</div>
  <div class="sub">Интерактивное поздравление с играми и музыкой</div>
  
  <a class="play-btn" href="javascript:void(0)" onclick="loadGame()">▶ ИГРАТЬ!</a>
  
  <div class="hint">Загрузится ~ 10 сек</div>
</div>

<!-- Loading overlay -->
<div class="loading" id="loader">
  <div class="spinner"></div>
  <p>Загружаем праздник...</p>
</div>

<script>
// Stars
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s=document.createElement('span');
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px`;
    c.appendChild(s);
  }
})();

function loadGame(){
  document.getElementById('loader').classList.add('on');
  // Загружаем игру
  window.location.href = 'Ulyana_Level8_Game.html';
}
</script>
</body>
</html>
