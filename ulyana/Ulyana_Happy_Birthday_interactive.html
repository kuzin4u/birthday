<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ульяна — Happy Birthday 🎂</title>
<style>
:root{--pink:#ff4fa3;--purple:#7c4dff;--cyan:#35d9ff;--yellow:#ffd84d;--bg:#090b22}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 25%,#252a67 0,#111535 35%,#070917 75%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:24px}
.card{width:min(920px,96vw);min-height:620px;border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.18);box-shadow:0 25px 90px #0009, inset 0 1px #fff2;backdrop-filter:blur(14px);position:relative;overflow:hidden;text-align:center}
.top{padding:28px 20px 8px;position:relative;z-index:3}.level{font-size:14px;letter-spacing:3px;opacity:.8}.title{font-size:clamp(28px,6vw,58px);font-weight:900;margin:8px 0;background:linear-gradient(90deg,#fff,#ffd4ec,#fff);-webkit-background-clip:text;color:transparent}
.subtitle{opacity:.75;font-size:15px}.stage-center{position:absolute;inset:160px 0 110px;display:flex;align-items:center;justify-content:center}
.ulf{font-size:110px;filter:drop-shadow(0 15px 22px #0008);animation:float 2.4s ease-in-out infinite;z-index:2}.ulf.sing{animation:sing .42s ease-in-out infinite alternate, float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(-2deg)}}@keyframes sing{to{transform:scale(1.08) translateY(-5px)}}
.lyric{position:absolute;bottom:28px;left:20px;right:20px;z-index:5;font-size:clamp(28px,5.5vw,54px);font-weight:900;min-height:70px;text-shadow:0 5px 25px #0008;transition:.18s}
.lyric.pop{animation:pop .34s ease}@keyframes pop{50%{transform:scale(1.12);color:#ffd84d}}
.note{position:absolute;font-size:28px;opacity:0;animation:rise 1.5s ease-out forwards;z-index:1}@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.3) rotate(15deg)}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;animation:spark 1.2s ease-out forwards;z-index:4}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.controls{position:absolute;bottom:12px;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:999px;padding:12px 22px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 8px 25px #0005;cursor:pointer}
#start{font-size:18px;padding:15px 28px}.hidden{display:none!important}
.final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#ff4fa333,transparent 55%);z-index:20;opacity:0;pointer-events:none;transition:opacity .5s}
.final.show{opacity:1;pointer-events:auto}.final h2{font-size:clamp(42px,9vw,82px);margin:8px;font-weight:1000}.final p{font-size:22px;opacity:.9}.cake{font-size:86px;animation:float 1.8s ease-in-out infinite}
.progress{position:absolute;left:12%;right:12%;bottom:94px;height:7px;border-radius:9px;background:#fff2;overflow:hidden;z-index:8}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yellow));transition:width .08s linear}
</style>
</head>
<body>
<div class="stage">
<div class="card" id="card">
  <div class="top">
    <div class="level">🎮 ULf PRESENTS</div>
    <div class="title">УЛЬЯНА — LEVEL 8! 🎂</div>
    <div class="subtitle">Финальная песня • Happy Birthday</div>
  </div>

  <div class="stage-center">
    <div class="ulf" id="ulf">🐺</div>
  </div>

  <div class="lyric" id="lyric">Нажми «Петь» 🎵</div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="controls" id="controls">
    <button id="start">🎤 Петь Happy Birthday</button>
    <button id="replay" class="hidden">↻ Ещё раз</button>
  </div>

  <div class="final" id="final">
    <div class="cake">🎂✨</div>
    <h2>УЛЬЯНА, 8! 🎉</h2>
    <p>С днём рождения! 💖</p>
    <button id="again">🎵 Спеть ещё раз</button>
  </div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let ctx, playing=false, raf, timers=[];

// Happy Birthday melody in C major.
// G G A G C B | G G A G D C | G G G E C B A | F F E C D C
const notes = {
 C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
 C5:523.25,D5:587.33
};

// Each item: note, duration in beats, displayed lyric fragment.
const song=[
 ['G4',1,'С'],['G4',1,'днём'],['A4',1,'рож'],['G4',1,'де'],['C5',1,'нья'],['B4',2,'тебя'],
 ['G4',1,'С'],['G4',1,'днём'],['A4',1,'рож'],['G4',1,'де'],['D5',1,'нья'],['C5',2,'тебя'],
 ['G4',1,'С'],['G4',1,'днём'],['G4',1,'рож'],['E4',1,'де'],['C5',1,'ни'],['B4',1,'я'],['A4',2,'Ульяна'],
 ['F4',1,'С'],['F4',1,'днём'],['E4',1,'рож'],['C5',1,'де'],['D5',1,'нья'],['C5',3,'тебя!']
];

const beat=.48; // seconds per beat
function tone(freq,dur,start){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(.18,start+.025);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur-.025);
  o.connect(g).connect(ctx.destination); o.start(start); o.stop(start+dur);
}
function confetti(){
  for(let i=0;i<70;i++){
    const s=document.createElement('i');s.className='spark';
    s.style.left=(50+Math.random()*12-6)+'%';s.style.top=(42+Math.random()*10-5)+'%';
    s.style.setProperty('--x',(Math.random()*600-300)+'px');
    s.style.setProperty('--y',(Math.random()*500-220)+'px');
    s.style.background=['#fff','#ffd84d','#ff4fa3','#35d9ff'][i%4];
    $('card').appendChild(s); setTimeout(()=>s.remove(),1300);
  }
}
function noteFX(){
  const n=document.createElement('div'); n.className='note';
  n.textContent=['♪','♫','✨','♪'][Math.floor(Math.random()*4)];
  n.style.left=(42+Math.random()*16)+'%'; n.style.top=(43+Math.random()*12)+'%';
  $('card').appendChild(n);setTimeout(()=>n.remove(),1500);
}
async function sing(){
  if(playing)return;
  playing=true; $('start').classList.add('hidden'); $('replay').classList.add('hidden'); $('final').classList.remove('show');
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const start=ctx.currentTime+.12;
  let t=0,total=song.reduce((a,x)=>a+x[1],0)*beat;
  song.forEach((x,i)=>{
    const [n,d,w]=x, dur=d*beat;
    tone(notes[n],dur,start+t);
    timers.push(setTimeout(()=>{
      $('lyric').textContent=w;
      $('lyric').classList.remove('pop'); void $('lyric').offsetWidth; $('lyric').classList.add('pop');
      $('ulf').classList.add('sing'); noteFX();
      setTimeout(()=>$('ulf').classList.remove('sing'),360);
    },t*1000));
    t+=dur;
  });
  const begin=performance.now();
  function tick(now){
    const p=Math.min(1,(now-begin)/1000/total); $('bar').style.width=(p*100)+'%';
    if(p<1)raf=requestAnimationFrame(tick); else finish();
  }
  raf=requestAnimationFrame(tick);
}
function finish(){
  playing=false; timers=[]; $('lyric').textContent='🎉 С днём рождения, Ульяна! 🎉';
  confetti(); setTimeout(()=>{$('final').classList.add('show')},650);
}
$('start').onclick=sing; $('replay').onclick=sing; $('again').onclick=sing;
</script>
</body>
</html>
